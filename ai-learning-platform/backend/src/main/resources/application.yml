server:
  port: 8080
  servlet:
    # 所有接口统一挂在 /api 前缀下
    context-path: /api

spring:
  application:
    name: ai-learning-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_learning?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 支持上传较大的课程视频文件
      max-file-size: 512MB
      max-request-size: 512MB
  ai:
    model:
      # 使用 Spring AI 的 OpenAI 通用协议接入
      chat: openai
    retry:
      # 关闭框架内置重试（默认最多 10 次、退避最长 3 分钟），429 限流重试统一由 ZhipuAiClient 控制（2 次指数退避）
      max-attempts: 1
    openai:
      # 任意 OpenAI 兼容端点均可切换（智谱 GLM / DeepSeek / OpenAI 等）
      api-key: ${ZHIPU_API_KEY:7bcfccd6e77e416789ae78ae4ddcec23.7OSmeF0NkcaMOqZS}
      base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      chat:
        # 智谱 OpenAI 兼容端点的补全路径（默认 /v1/chat/completions 不适用）
        completions-path: /chat/completions
        options:
          # GLM-4.7-Flash（免费模型，兼顾文本问答/出题/批改场景）
          model: ${AI_MODEL:glm-4.7-flash}
          temperature: 0.7

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Sa-Token 登录鉴权配置
sa-token:
  # 请求头中 token 的名称
  token-name: Authorization
  # token 有效期（秒），7 天
  timeout: 604800
  # 是否允许同一账号多地登录
  is-concurrent: true
  # token 风格：uuid
  token-style: uuid
  # 从请求头读取 token
  is-read-header: true
  is-read-cookie: false
  # 请求头 token 前缀
  token-prefix: Bearer
  is-log: false

# 文件上传存储目录（图片/视频统一存放在项目下的 projectfiles 目录）
file:
  upload-dir: projectfiles
